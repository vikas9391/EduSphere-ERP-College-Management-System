spring.application.name=college-erp-backend

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

# HikariCP: keep connections healthy without forcing very short keepalive cycles.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Redis is used as an infrastructure/cache dependency, not as a Spring Data repository store.
spring.data.redis.repositories.enabled=false

server.port=8080
logging.level.com.collegeerp=INFO

# Expose only a minimal health endpoint; never expose env/beans/configuration
# details through Actuator in a public deployment.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Mail (used for "forgot password" emails - see EmailService). If MAIL_HOST is left
# unset, sending fails gracefully at send-time and the reset link is logged instead,
# so forgot-password stays usable with no SMTP server configured locally.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Base URL of the deployed frontend - used to build the link inside password-reset emails.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset-token-expiry-minutes=${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:30}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
